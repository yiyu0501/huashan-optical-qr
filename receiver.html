<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2f6047"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"><title>接收端｜一局棋，一個行動</title></head><body>
<main class="shell"><header class="top"><div class="brand"><div class="mark">掃</div><div>手機接收端<small>對準會變動的 QR，保持不動即可</small></div></div><a class="pill" href="index.html">說明</a></header>
<section class="grid"><article class="card camera-card"><div class="video-wrap"><video id="video" playsinline muted></video><div class="scan-guide"></div></div><canvas id="canvas" hidden></canvas><div class="actions"><button class="btn primary" id="startBtn">啟動相機開始掃描</button><button class="btn" id="resetBtn">重新掃描</button></div><div class="progress"><div id="progressBar"></div></div><div class="status" id="status"><strong>尚未啟動相機。</strong><br>第一次使用請允許相機權限。</div></article><article class="card"><div class="kicker">RECEIVED</div><h2 style="font-size:28px;margin-top:7px">你的檔案會出現在這裡</h2><p>掃描過程中可以漏掉 QR；傳送端會循環播放，手機只要繼續對準就會補齊。</p><div class="receive-result" id="result"><div class="preview"><img id="preview" alt="接收到的圖卡"></div><div class="actions"><a class="btn primary" id="downloadBtn" download>下載到手機</a></div><div class="code-note" id="fileMeta"></div></div><div class="status" id="offlineNote"><strong>離線提醒：</strong><br>若你已經在有網路時開過這頁，頁面與 QR 解碼器會被快取；之後關網路仍能掃。iPhone 相機需要 HTTPS，所以不要把 receiver.html 直接從「檔案」App 開啟。</div></article></section>
<footer class="footer">資料只經由鏡頭掃描進入這支手機；本頁不會把收到的圖卡上傳到伺服器。</footer></main>
<script src="protocol.js"></script><script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
const $=s=>document.querySelector(s),video=$('#video'),canvas=$('#canvas'),ctx=canvas.getContext('2d',{willReadFrequently:true});let stream=null,running=false,lastScan=0,doneUrl=null;const collector=new HYQR.Collector();
function setStatus(html){$('#status').innerHTML=html}function reset(){collector.reset();$('#progressBar').style.width='0%';$('#result').classList.remove('show');if(doneUrl){URL.revokeObjectURL(doneUrl);doneUrl=null}setStatus('<strong>準備重新掃描。</strong><br>請把鏡頭對準動態 QR。')}
async function start(){try{if(!window.jsQR)throw new Error('QR 解碼器尚未快取，請先連網開啟一次這個頁面。');if(stream)stream.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});video.srcObject=stream;await video.play();running=true;reset();setStatus('<strong>掃描中…</strong><br>把 QR 放在白框內，保持手機穩定。');requestAnimationFrame(loop)}catch(e){setStatus('<strong>無法開啟相機。</strong><br>'+e.message+'<br>請確認網址是 HTTPS 並允許相機權限。')}}
function loop(ts){if(!running)return;if(ts-lastScan>110&&video.readyState>=2){lastScan=ts;const targetW=640,ratio=video.videoHeight/video.videoWidth||1.333;canvas.width=targetW;canvas.height=Math.round(targetW*ratio);ctx.drawImage(video,0,0,canvas.width,canvas.height);const img=ctx.getImageData(0,0,canvas.width,canvas.height);const code=jsQR(img.data,img.width,img.height,{inversionAttempts:'dontInvert'});if(code&&code.data){const out=collector.add(code.data);if(out.accepted){const pct=Math.round(out.received/out.total*100);$('#progressBar').style.width=pct+'%';setStatus(`<strong>已收到 ${out.received} / ${out.total} 段（${pct}%）</strong><br>繼續對準，不需要追著 QR 變化。`);if(out.complete&&out.result&&!out.error){finish(out.result);return}}}}requestAnimationFrame(loop)}
function finish(file){running=false;setStatus('<strong>接收完成 ✓</strong><br>內容已在這支手機本機重組並驗證。');const blob=new Blob([file.text],{type:file.mime});doneUrl=URL.createObjectURL(blob);$('#preview').src=doneUrl;$('#downloadBtn').href=doneUrl;$('#downloadBtn').download=file.name;$('#fileMeta').textContent=`${file.name} · ${file.mime}`;$('#result').classList.add('show');if(stream)stream.getTracks().forEach(t=>t.stop())}
$('#startBtn').addEventListener('click',start);$('#resetBtn').addEventListener('click',()=>{reset();if(!running&&stream&&stream.active){running=true;requestAnimationFrame(loop)}});if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
