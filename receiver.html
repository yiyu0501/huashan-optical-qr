<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0d">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <title>手機接收端｜Huashan Optical QR</title>
</head>
<body>
  <main class="site-shell">
    <header class="site-header">
      <a class="brand" href="index.html">
        <div class="brand-mark">◎</div>
        <div class="brand-copy">
          <strong>MOBILE RECEIVER</strong>
          <span>對準動態 QR · 保持穩定即可</span>
        </div>
      </a>
      <div class="top-actions">
        <a class="nav-link" href="index.html">使用說明</a>
      </div>
    </header>

    <section class="receiver-layout">
      <section class="panel camera-panel">
        <div class="camera-wrap">
          <video id="video" playsinline muted></video>
          <div class="scan-shade"></div>
          <div class="scan-box"></div>
        </div>
        <canvas id="canvas" hidden></canvas>

        <div class="camera-actions">
          <button class="btn primary" id="startBtn">啟動相機開始掃描</button>
          <button class="btn ghost" id="resetBtn">重置</button>
        </div>

        <div class="progress-wrap">
          <div class="progress-head"><span>RECEIVING FRAMES</span><span id="progressText">0%</span></div>
          <div class="progress"><div id="progressBar"></div></div>
        </div>

        <div class="status-box" id="status">
          <strong>尚未啟動相機。</strong><br>
          第一次使用請允許瀏覽器相機權限。
        </div>
      </section>

      <section class="panel receive-panel">
        <div class="eyebrow">RECEIVED ITEM</div>
        <h1 class="display-title">你的紀念，<br>會出現在這裡。</h1>
        <p class="lead">掃描過程可以漏掉部分 QR。傳送端會循環播放，保持鏡頭穩定，系統會自動補齊並在手機本機完成重組。</p>

        <div class="receive-empty" id="emptyState">
          <div><span class="king">♚</span>等待接收資料</div>
        </div>

        <div class="receive-result" id="result">
          <div class="preview-wrap"><img id="preview" alt="接收到的圖卡"></div>
          <div class="actions-row" style="margin-top:12px">
            <a class="btn primary" id="downloadBtn" download>下載到手機</a>
            <button class="btn ghost" id="scanAgainBtn">掃描下一張</button>
          </div>
          <div class="file-meta" id="fileMeta"></div>
        </div>

        <div class="status-box" style="margin-top:16px">
          <strong>Privacy</strong><br>
          圖卡只透過手機相機進入這支裝置，本頁不會把接收到的內容上傳到伺服器。
        </div>
      </section>
    </section>

    <footer class="footer">
      <div><strong>離線使用提醒</strong><br>請先在有網路時開啟一次本頁，讓 QR 解碼器與頁面資源完成快取。</div>
      <div>Camera access requires HTTPS</div>
    </footer>
  </main>

  <script src="protocol.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  <script>
    const $=s=>document.querySelector(s);
    const video=$('#video');
    const canvas=$('#canvas');
    const ctx=canvas.getContext('2d',{willReadFrequently:true});
    let stream=null,running=false,lastScan=0,doneUrl=null;
    const collector=new HYQR.Collector();

    function setStatus(html){$('#status').innerHTML=html}

    function reset(){
      collector.reset();
      $('#progressBar').style.width='0%';
      $('#progressText').textContent='0%';
      $('#result').classList.remove('show');
      $('#emptyState').style.display='flex';
      if(doneUrl){URL.revokeObjectURL(doneUrl);doneUrl=null}
      setStatus('<strong>準備掃描。</strong><br>請把鏡頭對準傳送端動態 QR。');
    }

    async function start(){
      try{
        if(!window.jsQR) throw new Error('QR 解碼器尚未快取，請先連網開啟一次這個頁面。');
        if(stream) stream.getTracks().forEach(t=>t.stop());

        stream=await navigator.mediaDevices.getUserMedia({
          video:{
            facingMode:{ideal:'environment'},
            width:{ideal:1280},
            height:{ideal:720}
          },
          audio:false
        });

        video.srcObject=stream;
        await video.play();
        running=true;
        reset();
        setStatus('<strong>掃描中…</strong><br>把 QR 放在金色框內並保持手機穩定。');
        requestAnimationFrame(loop);
      }catch(e){
        setStatus(`<strong>無法開啟相機。</strong><br>${e.message}<br>請確認網址使用 HTTPS 並允許相機權限。`);
      }
    }

    function loop(ts){
      if(!running) return;

      if(ts-lastScan>110 && video.readyState>=2){
        lastScan=ts;
        const targetW=640;
        const ratio=video.videoHeight/video.videoWidth||1.333;
        canvas.width=targetW;
        canvas.height=Math.round(targetW*ratio);
        ctx.drawImage(video,0,0,canvas.width,canvas.height);

        const img=ctx.getImageData(0,0,canvas.width,canvas.height);
        const code=jsQR(img.data,img.width,img.height,{inversionAttempts:'dontInvert'});

        if(code&&code.data){
          const out=collector.add(code.data);
          if(out.accepted){
            const pct=Math.round(out.received/out.total*100);
            $('#progressBar').style.width=pct+'%';
            $('#progressText').textContent=pct+'%';
            setStatus(`<strong>已收到 ${out.received} / ${out.total} 段</strong><br>繼續對準即可，不需要追著 QR 的變化。`);

            if(out.complete&&out.result&&!out.error){
              finish(out.result);
              return;
            }
          }
        }
      }
      requestAnimationFrame(loop);
    }

    function finish(file){
      running=false;
      $('#progressBar').style.width='100%';
      $('#progressText').textContent='100%';
      setStatus('<strong>接收完成 ✓</strong><br>檔案已在這支手機本機完成重組與驗證。');

      const blob=new Blob([file.text],{type:file.mime});
      doneUrl=URL.createObjectURL(blob);
      $('#preview').src=doneUrl;
      $('#downloadBtn').href=doneUrl;
      $('#downloadBtn').download=file.name;
      $('#fileMeta').textContent=`${file.name} · ${file.mime}`;
      $('#emptyState').style.display='none';
      $('#result').classList.add('show');

      if(stream) stream.getTracks().forEach(t=>t.stop());
    }

    $('#startBtn').addEventListener('click',start);
    $('#resetBtn').addEventListener('click',()=>{
      reset();
      if(!running&&stream&&stream.active){
        running=true;
        requestAnimationFrame(loop);
      }
    });
    $('#scanAgainBtn').addEventListener('click',start);

    if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
  </script>
</body>
</html>
