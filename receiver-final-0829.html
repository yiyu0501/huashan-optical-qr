<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0d">
  <link rel="stylesheet" href="styles.css?v=0829-final2">
  <title>紀念卡接收端｜Huashan Optical QR</title>
<script>
(async()=>{
  try{
    if(!sessionStorage.getItem('huashan-final-cache-cleared')){
      sessionStorage.setItem('huashan-final-cache-cleared','1');
      if('serviceWorker' in navigator){
        const regs=await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map(r=>r.unregister()));
      }
      if('caches' in window){
        const keys=await caches.keys();
        await Promise.all(keys.map(k=>caches.delete(k)));
      }
      location.reload();
    }
  }catch(e){ console.warn('cache cleanup skipped',e); }
})();
</script>
</head>
<body>
  <main class="site-shell">
    <header class="site-header">
      <a class="brand" href="index.html">
        <div class="brand-mark">◎</div>
        <div class="brand-copy">
          <strong>KEEPSAKE RECEIVER · FINAL</strong>
          <span>只接受 BLACK KING / WHITE KING</span>
        </div>
      </a>
      <div class="top-actions">
        <a class="nav-link" href="index.html">回首頁</a>
      </div>
    </header>

    <section class="receiver-layout">
      <section class="panel camera-panel">
        <div class="camera-wrap">
          <video id="video" playsinline muted></video>
          <div class="scan-shade"></div>
          <div class="scan-box"></div>
        </div>
        <canvas id="canvas" hidden></canvas>

        <div class="camera-actions">
          <button class="btn primary" id="startBtn">啟動相機開始掃描</button>
          <button class="btn ghost" id="resetBtn">重置</button>
        </div>

        <div class="progress-wrap">
          <div class="progress-head"><span>KEEPSAKE RECEIVING</span><span id="progressText">0%</span></div>
          <div class="progress"><div id="progressBar"></div></div>
        </div>

        <div class="status-box" id="status">
          <strong>尚未啟動相機。</strong><br>
          這個版本只會顯示 Black King 或 White King。
        </div>
      </section>

      <section class="panel receive-panel">
        <div class="eyebrow">YOUR KEEPSAKE</div>
        <h1 class="display-title">今天的紀念，<br>只會是這兩張之一。</h1>
        <p class="lead">完成掃描後，只有 Black King 或 White King 會出現在這裡。Challenge 卡或其他舊檔案都會被直接拒絕。</p>

        <div class="receive-empty" id="emptyState">
          <div><span class="king">♚</span>等待 Black King / White King</div>
        </div>

        <div class="receive-result" id="result">
          <div class="preview-wrap"><img id="preview" alt="收到的紀念卡"></div>
          <div class="actions-row" style="margin-top:12px">
            <a class="btn primary" id="downloadBtn" download>下載紀念卡</a>
            <button class="btn ghost" id="scanAgainBtn">掃描下一張</button>
          </div>
          <div class="file-meta" id="fileMeta"></div>
        </div>
      </section>
    </section>
  </main>

  <script src="protocol.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  <script>
    const $=s=>document.querySelector(s);
    const video=$('#video'),canvas=$('#canvas'),ctx=canvas.getContext('2d',{willReadFrequently:true});
    let stream=null,running=false,lastScan=0,doneUrl=null;
    const collector=new HYQR.Collector();

    function setStatus(html){$('#status').innerHTML=html}

    function reset(){
      collector.reset();
      $('#progressBar').style.width='0%';
      $('#progressText').textContent='0%';
      $('#result').classList.remove('show');
      $('#emptyState').style.display='flex';
      if(doneUrl){URL.revokeObjectURL(doneUrl);doneUrl=null}
      setStatus('<strong>準備掃描。</strong><br>請對準 FINAL 傳送端的動態 QR。');
    }

    async function start(){
      try{
        if(!window.jsQR)throw new Error('QR 解碼器尚未載入，請重新整理頁面。');
        if(stream)stream.getTracks().forEach(t=>t.stop());

        stream=await navigator.mediaDevices.getUserMedia({
          video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},
          audio:false
        });

        video.srcObject=stream;
        await video.play();
        running=true;
        reset();
        setStatus('<strong>掃描中…</strong><br>保持手機穩定，直到進度到 100%。');
        requestAnimationFrame(loop);
      }catch(e){
        setStatus('<strong>無法開啟相機。</strong><br>'+e.message);
      }
    }

    function loop(ts){
      if(!running)return;

      if(ts-lastScan>110&&video.readyState>=2){
        lastScan=ts;
        const targetW=640,ratio=video.videoHeight/video.videoWidth||1.333;
        canvas.width=targetW;
        canvas.height=Math.round(targetW*ratio);
        ctx.drawImage(video,0,0,canvas.width,canvas.height);

        const img=ctx.getImageData(0,0,canvas.width,canvas.height);
        const code=jsQR(img.data,img.width,img.height,{inversionAttempts:'dontInvert'});

        if(code&&code.data){
          const out=collector.add(code.data);
          if(out.accepted){
            const pct=Math.round(out.received/out.total*100);
            $('#progressBar').style.width=pct+'%';
            $('#progressText').textContent=pct+'%';

            if(out.complete&&out.result&&!out.error){
              const name=(out.result.name||'').toUpperCase();

              // HARD FILTER: only these two final-card filenames are allowed.
              if(!name.startsWith('BLACK-KING-') && !name.startsWith('WHITE-KING-')){
                collector.reset();
                $('#progressBar').style.width='0%';
                $('#progressText').textContent='0%';
                setStatus('<strong>已忽略舊檔案。</strong><br>這不是 Black King / White King，請繼續掃描 FINAL 傳送端。');
              }else{
                finish(out.result);
                return;
              }
            }else{
              setStatus(`<strong>已收到 ${out.received} / ${out.total} 段</strong><br>繼續對準即可。`);
            }
          }
        }
      }
      requestAnimationFrame(loop);
    }

    function finish(file){
      running=false;
      $('#progressBar').style.width='100%';
      $('#progressText').textContent='100%';

      const isBlack=file.name.toUpperCase().startsWith('BLACK-KING-');
      const label=isBlack?'BLACK KING｜黑王':'WHITE KING｜白王';

      setStatus(`<strong>接收完成 ✓ ${label}</strong><br>這就是本次抽到的正式紀念卡。`);

      const blob=new Blob([file.text],{type:file.mime});
      doneUrl=URL.createObjectURL(blob);
      $('#preview').src=doneUrl;
      $('#downloadBtn').href=doneUrl;
      $('#downloadBtn').download=file.name;
      $('#fileMeta').textContent=`${label} · ${file.name}`;

      $('#emptyState').style.display='none';
      $('#result').classList.add('show');

      if(stream)stream.getTracks().forEach(t=>t.stop());
    }

    $('#startBtn').addEventListener('click',start);
    $('#resetBtn').addEventListener('click',reset);
    $('#scanAgainBtn').addEventListener('click',start);

    // Intentionally no service worker on this FINAL page.
  </script>
</body>
</html>
